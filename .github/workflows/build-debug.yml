name: Build Debug APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-levels: 37
          ndk-version: 26.1.10909125
          cmake-version: 3.28.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Restore Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: .gradle/build-cache
          key: gradle-build-cache-${{ runner.os }}-${{ github.ref }}
          restore-keys: |
            gradle-build-cache-${{ runner.os }}-
            gradle-build-cache-

      - name: Restore Gradle Dependencies Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties', '**/gradle.properties', '**/build.gradle.kts') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Cache Submodules
        uses: actions/cache@v4
        with:
          path: |
            external/hoshidicts-kotlin-bridge
            external/hoshidicts-kotlin-bridge/app/src/main/cpp/hoshidicts
            external/hoshidicts-kotlin-bridge/app/src/main/cpp/hoshidicts/external
          key: submodules-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            submodules-${{ runner.os }}-

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug \
            --build-cache \
            --parallel

      - name: Find Debug APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ No Debug APK found"
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "apk_name=$(basename $APK_PATH)" >> $GITHUB_OUTPUT
          echo "apk_size=$(du -h $APK_PATH | cut -f1)" >> $GITHUB_OUTPUT

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: Comment PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ Debug APK built successfully!\n\n📦 **${{ steps.apk.outputs.apk_name }}** (${{ steps.apk.outputs.apk_size }})\n\nDownload from the Artifacts section.`
            })
